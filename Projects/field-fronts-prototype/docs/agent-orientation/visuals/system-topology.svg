<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Field Fronts System Topology">

<style>
  .bg{fill:#07101b}.panel{fill:#0f1a2a;stroke:#29405d;stroke-width:1.2}.panel2{fill:#122236;stroke:#355272;stroke-width:1.2}
  .title{font:700 26px system-ui,Segoe UI,Arial;fill:#e9f4ff}.subtitle{font:500 13px system-ui,Segoe UI,Arial;fill:#9fb6cc}
  .label{font:600 13px system-ui,Segoe UI,Arial;fill:#e9f4ff}.small{font:500 11px system-ui,Segoe UI,Arial;fill:#b6c8d8}
  .tiny{font:500 9px system-ui,Segoe UI,Arial;fill:#91a7bb}.cyan{fill:#63e6ff}.blue{fill:#8fb7ff}.green{fill:#84f0a8}.amber{fill:#ffd166}.orange{fill:#ff9f68}.red{fill:#ff6b6b}.purple{fill:#c39bff}.muted{fill:#8195aa}
  .arrow{stroke:#9fb6cc;stroke-width:2;fill:none;marker-end:url(#arrow)}.softarrow{stroke:#536b82;stroke-width:1.5;fill:none;marker-end:url(#softarrow)}
  .dash{stroke-dasharray:6 5}.boxtext{font:600 12px system-ui,Segoe UI,Arial;fill:#e9f4ff}.note{font:500 10px system-ui,Segoe UI,Arial;fill:#a9bfd2}
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9fb6cc"/></marker>
  <marker id="softarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536b82"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect class="bg" width="1100" height="640"/>
<text class="title" x="28" y="42">Field Fronts System Topology</text>
<text class="subtitle" x="30" y="66">Module ownership map for agents before touching code</text>
<rect x="24" y="88" width="1050" height="520" rx="18" fill="#0b1422" stroke="#1f3550"/>
<rect class="panel" x="70" y="140" width="190" height="82" rx="12"/>
<text class="boxtext" x="84" y="165">src/world</text><text class="note" x="84" y="185">Map model, fields</text>
<circle class="green" cx="238" cy="164" r="7" filter="url(#glow)"/>
<rect class="panel" x="320" y="140" width="190" height="82" rx="12"/>
<text class="boxtext" x="334" y="165">src/game</text><text class="note" x="334" y="185">GameState, economy, jobs</text>
<circle class="cyan" cx="488" cy="164" r="7" filter="url(#glow)"/>
<rect class="panel" x="570" y="140" width="190" height="82" rx="12"/>
<text class="boxtext" x="584" y="165">src/editor</text><text class="note" x="584" y="185">Placement/editor state</text>
<circle class="purple" cx="738" cy="164" r="7" filter="url(#glow)"/>
<rect class="panel" x="820" y="140" width="190" height="82" rx="12"/>
<text class="boxtext" x="834" y="165">src/input</text><text class="note" x="834" y="185">Pointer -&gt; command</text>
<circle class="blue" cx="988" cy="164" r="7" filter="url(#glow)"/>
<rect class="panel" x="195" y="320" width="210" height="82" rx="12"/>
<text class="boxtext" x="209" y="345">src/rendering</text><text class="note" x="209" y="365">Canvas projection only</text>
<circle class="orange" cx="383" cy="344" r="7" filter="url(#glow)"/>
<rect class="panel" x="455" y="320" width="210" height="82" rx="12"/>
<text class="boxtext" x="469" y="345">src/ui</text><text class="note" x="469" y="365">Buttons, panels, HUD</text>
<circle class="amber" cx="643" cy="344" r="7" filter="url(#glow)"/>
<rect class="panel" x="715" y="320" width="210" height="82" rx="12"/>
<text class="boxtext" x="729" y="345">src/qa + tests</text><text class="note" x="729" y="365">Validation + evidence</text>
<circle class="red" cx="903" cy="344" r="7" filter="url(#glow)"/>
<path class="arrow" d="M260,181 C290,181 290,181 320,181"/>
<path class="arrow" d="M510,181 C540,181 540,181 570,181"/>
<path class="arrow" d="M760,181 C790,181 790,181 820,181"/>
<path class="arrow" d="M415,181 C435,181 435,320 455,320"/>
<path class="arrow" d="M665,181 C690,181 690,320 715,320"/>
<path class="arrow" d="M320,222 C300,222 300,320 280,320"/>
<path class="arrow" d="M570,222 C565,222 565,320 560,320"/>
<path class="arrow" d="M820,222 C820,222 820,320 820,320"/>
<path class="arrow" d="M715,360 C667,360 667,360 620,360"/>
<path class="arrow" d="M455,360 C430,360 430,360 405,360"/>
<path class="arrow" d="M320,222 C310,222 310,320 300,320"/>
<text class="small" x="62" y="548">Core rule: world/game/editor own truth; rendering/UI expose projections and commands; QA proves seams without becoming game authority.</text>
</svg>
