<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="QA Validation Matrix">

<style>
  .bg{fill:#07101b}.panel{fill:#0f1a2a;stroke:#29405d;stroke-width:1.2}.panel2{fill:#122236;stroke:#355272;stroke-width:1.2}
  .title{font:700 26px system-ui,Segoe UI,Arial;fill:#e9f4ff}.subtitle{font:500 13px system-ui,Segoe UI,Arial;fill:#9fb6cc}
  .label{font:600 13px system-ui,Segoe UI,Arial;fill:#e9f4ff}.small{font:500 11px system-ui,Segoe UI,Arial;fill:#b6c8d8}
  .tiny{font:500 9px system-ui,Segoe UI,Arial;fill:#91a7bb}.cyan{fill:#63e6ff}.blue{fill:#8fb7ff}.green{fill:#84f0a8}.amber{fill:#ffd166}.orange{fill:#ff9f68}.red{fill:#ff6b6b}.purple{fill:#c39bff}.muted{fill:#8195aa}
  .arrow{stroke:#9fb6cc;stroke-width:2;fill:none;marker-end:url(#arrow)}.softarrow{stroke:#536b82;stroke-width:1.5;fill:none;marker-end:url(#softarrow)}
  .dash{stroke-dasharray:6 5}.boxtext{font:600 12px system-ui,Segoe UI,Arial;fill:#e9f4ff}.note{font:500 10px system-ui,Segoe UI,Arial;fill:#a9bfd2}
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9fb6cc"/></marker>
  <marker id="softarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536b82"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect class="bg" width="1100" height="620"/>
<text class="title" x="28" y="42">QA Validation Matrix</text>
<text class="subtitle" x="30" y="66">Patch type to minimum proof mapping for future agents</text>
<text class="label" x="45" y="112">Patch type</text>
<text class="label" x="340" y="112">Minimum proof</text>
<text class="label" x="705" y="112">Why</text>
<rect x="30" y="115" width="1035" height="62" rx="7" fill="#102239" stroke="#263e57"/>
<text class="small" x="45" y="140">Docs only</text>
<text class="small" x="340" y="140">file existence + fence check</text>
<text class="small" x="705" y="140">orientation remains readable</text>
<rect x="30" y="185" width="1035" height="62" rx="7" fill="#132b3d" stroke="#263e57"/>
<text class="small" x="45" y="210">UI / rendering</text>
<text class="small" x="340" y="210">browser smoke</text>
<text class="small" x="705" y="210">visual shell still boots</text>
<rect x="30" y="255" width="1035" height="62" rx="7" fill="#102239" stroke="#263e57"/>
<text class="small" x="45" y="280">Placement / economy</text>
<text class="small" x="340" y="280">npm test + constructionJobs</text>
<text class="small" x="705" y="280">no free/duplicate spending</text>
<rect x="30" y="325" width="1035" height="62" rx="7" fill="#132b3d" stroke="#263e57"/>
<text class="small" x="45" y="350">Movement / nav</text>
<text class="small" x="340" y="350">gameModel + collision tests</text>
<text class="small" x="705" y="350">units do not phase/block wrongly</text>
<rect x="30" y="395" width="1035" height="62" rx="7" fill="#102239" stroke="#263e57"/>
<text class="small" x="45" y="420">Fields / LoS / frontline</text>
<text class="small" x="340" y="420">runtimePerformanceQa + browser</text>
<text class="small" x="705" y="420">no hidden FPS murder</text>
<rect x="30" y="465" width="1035" height="62" rx="7" fill="#132b3d" stroke="#263e57"/>
<text class="small" x="45" y="490">Topology / blockers</text>
<text class="small" x="340" y="490">structureRegistry/topology/collision</text>
<text class="small" x="705" y="490">nav signatures stay honest</text>
<text class="small" x="42" y="585">Baseline commands: node --check changed JS · npm.cmd test · npm.cmd run test:browser when browser surface changed.</text>
</svg>
