<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-label="Construction Flow">

<style>
  .bg{fill:#07101b}.panel{fill:#0f1a2a;stroke:#29405d;stroke-width:1.2}.panel2{fill:#122236;stroke:#355272;stroke-width:1.2}
  .title{font:700 26px system-ui,Segoe UI,Arial;fill:#e9f4ff}.subtitle{font:500 13px system-ui,Segoe UI,Arial;fill:#9fb6cc}
  .label{font:600 13px system-ui,Segoe UI,Arial;fill:#e9f4ff}.small{font:500 11px system-ui,Segoe UI,Arial;fill:#b6c8d8}
  .tiny{font:500 9px system-ui,Segoe UI,Arial;fill:#91a7bb}.cyan{fill:#63e6ff}.blue{fill:#8fb7ff}.green{fill:#84f0a8}.amber{fill:#ffd166}.orange{fill:#ff9f68}.red{fill:#ff6b6b}.purple{fill:#c39bff}.muted{fill:#8195aa}
  .arrow{stroke:#9fb6cc;stroke-width:2;fill:none;marker-end:url(#arrow)}.softarrow{stroke:#536b82;stroke-width:1.5;fill:none;marker-end:url(#softarrow)}
  .dash{stroke-dasharray:6 5}.boxtext{font:600 12px system-ui,Segoe UI,Arial;fill:#e9f4ff}.note{font:500 10px system-ui,Segoe UI,Arial;fill:#a9bfd2}
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9fb6cc"/></marker>
  <marker id="softarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536b82"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect class="bg" width="1100" height="610"/>
<text class="title" x="28" y="42">Construction Flow</text>
<text class="subtitle" x="30" y="66">Button to blueprint to builder job to activated structure</text>
<rect class="panel2" x="35" y="180" width="120" height="58" rx="12"/>
<text class="boxtext" x="49" y="205">Build button</text>
<path class="arrow" d="M155,209.0 L205,209.0"/>
<rect class="panel2" x="205" y="180" width="120" height="58" rx="12"/>
<text class="boxtext" x="219" y="205">Select type</text>
<path class="arrow" d="M325,209.0 L375,209.0"/>
<rect class="panel2" x="375" y="180" width="120" height="58" rx="12"/>
<text class="boxtext" x="389" y="205">Preview</text>
<path class="arrow" d="M495,209.0 L545,209.0"/>
<rect class="panel2" x="545" y="180" width="120" height="58" rx="12"/>
<text class="boxtext" x="559" y="205">Validate</text>
<path class="arrow" d="M665,209.0 L715,209.0"/>
<rect class="panel2" x="715" y="180" width="120" height="58" rx="12"/>
<text class="boxtext" x="729" y="205">Spend supplies</text>
<path class="arrow" d="M835,209.0 L885,209.0"/>
<rect class="panel2" x="885" y="180" width="120" height="58" rx="12"/>
<text class="boxtext" x="899" y="205">Create blueprint</text>
<path class="arrow" d="M945.0,238 C945.0,285 15,295 35,374.0"/>
<rect class="panel" x="35" y="345" width="120" height="58" rx="12"/>
<text class="boxtext" x="49" y="370">Create job</text>
<path class="arrow" d="M155,374.0 L205,374.0"/>
<rect class="panel" x="205" y="345" width="120" height="58" rx="12"/>
<text class="boxtext" x="219" y="370">Builder claims</text>
<path class="arrow" d="M325,374.0 L375,374.0"/>
<rect class="panel" x="375" y="345" width="120" height="58" rx="12"/>
<text class="boxtext" x="389" y="370">Move to site</text>
<path class="arrow" d="M495,374.0 L545,374.0"/>
<rect class="panel" x="545" y="345" width="120" height="58" rx="12"/>
<text class="boxtext" x="559" y="370">Work ticks</text>
<path class="arrow" d="M665,374.0 L715,374.0"/>
<rect class="panel" x="715" y="345" width="120" height="58" rx="12"/>
<text class="boxtext" x="729" y="370">Complete</text>
<path class="arrow" d="M835,374.0 L885,374.0"/>
<rect class="panel" x="885" y="345" width="120" height="58" rx="12"/>
<text class="boxtext" x="899" y="370">Activate topology</text>
<rect x="55" y="505" width="990" height="62" rx="12" fill="#132536" stroke="#2e4861"/>
<text class="small" x="75" y="532">QA proves: supplies deducted once · invalid placement rejected · job progresses over sim ticks · completed structures activate collision/nav/occupancy/influence.</text>
</svg>
