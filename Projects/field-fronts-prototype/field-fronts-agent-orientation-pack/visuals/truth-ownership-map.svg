<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Truth Ownership Map">

<style>
  .bg{fill:#07101b}.panel{fill:#0f1a2a;stroke:#29405d;stroke-width:1.2}.panel2{fill:#122236;stroke:#355272;stroke-width:1.2}
  .title{font:700 26px system-ui,Segoe UI,Arial;fill:#e9f4ff}.subtitle{font:500 13px system-ui,Segoe UI,Arial;fill:#9fb6cc}
  .label{font:600 13px system-ui,Segoe UI,Arial;fill:#e9f4ff}.small{font:500 11px system-ui,Segoe UI,Arial;fill:#b6c8d8}
  .tiny{font:500 9px system-ui,Segoe UI,Arial;fill:#91a7bb}.cyan{fill:#63e6ff}.blue{fill:#8fb7ff}.green{fill:#84f0a8}.amber{fill:#ffd166}.orange{fill:#ff9f68}.red{fill:#ff6b6b}.purple{fill:#c39bff}.muted{fill:#8195aa}
  .arrow{stroke:#9fb6cc;stroke-width:2;fill:none;marker-end:url(#arrow)}.softarrow{stroke:#536b82;stroke-width:1.5;fill:none;marker-end:url(#softarrow)}
  .dash{stroke-dasharray:6 5}.boxtext{font:600 12px system-ui,Segoe UI,Arial;fill:#e9f4ff}.note{font:500 10px system-ui,Segoe UI,Arial;fill:#a9bfd2}
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9fb6cc"/></marker>
  <marker id="softarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536b82"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect class="bg" width="1000" height="620"/>
<text class="title" x="28" y="42">Truth Ownership Map</text>
<text class="subtitle" x="30" y="66">Canonical, runtime, derived, visual and evidence layers</text>
<rect x="55" y="120" width="200" height="72" rx="10" fill="#17452c" stroke="#446076"/>
<text class="label" x="72" y="148">CANONICAL / AUTHORED</text><text class="tiny" x="72" y="168">MapData · terrain, authored map, resources</text>
<rect x="55" y="210" width="200" height="72" rx="10" fill="#14506a" stroke="#446076"/>
<text class="label" x="72" y="238">RUNTIME-OWNED</text><text class="tiny" x="72" y="258">GameState · entities, economy, construction jobs</text>
<rect x="55" y="300" width="200" height="72" rx="10" fill="#49376a" stroke="#446076"/>
<text class="label" x="72" y="328">DERIVED PROJECTION</text><text class="tiny" x="72" y="348">Fields · command, LoS, frontline, overlays</text>
<rect x="55" y="390" width="200" height="72" rx="10" fill="#5c3a18" stroke="#446076"/>
<text class="label" x="72" y="418">VISUAL / UI ONLY</text><text class="tiny" x="72" y="438">Renderer + UI · canvas, HUD, buttons</text>
<rect x="55" y="480" width="200" height="72" rx="10" fill="#5e2525" stroke="#446076"/>
<text class="label" x="72" y="508">EVIDENCE ONLY</text><text class="tiny" x="72" y="528">QA Reports · browser smoke, performance output</text>
<rect class="panel2" x="370" y="145" width="220" height="78" rx="12"/>
<text class="boxtext" x="384" y="170">MapData</text><text class="note" x="384" y="190">authored source</text>
<rect class="panel2" x="370" y="265" width="220" height="78" rx="12"/>
<text class="boxtext" x="384" y="290">GameState</text><text class="note" x="384" y="310">live runtime state</text>
<rect class="panel" x="700" y="205" width="230" height="100" rx="12"/>
<text class="boxtext" x="714" y="230">Derived tactical fields</text><text class="note" x="714" y="250">rebuilt from sources; not persisted casually</text>
<rect class="panel" x="700" y="365" width="230" height="78" rx="12"/>
<text class="boxtext" x="714" y="390">Canvas / HUD</text><text class="note" x="714" y="410">draw only; no authority</text>
<rect class="panel" x="370" y="455" width="220" height="78" rx="12"/>
<text class="boxtext" x="384" y="480">QA artefacts</text><text class="note" x="384" y="500">evidence, not automatic truth</text>
<path class="arrow" d="M590,184 C645,184 645,238 700,238"/>
<path class="arrow" d="M590,304 C645,304 645,255 700,255"/>
<path class="arrow" d="M815,305 C815,305 815,365 815,365"/>
<path class="arrow" d="M700,405 C645,405 645,494 590,494"/>
<path class="softarrow dash" d="M480,455 C480,405 640,344 700,295"/>
<text class="small" x="58" y="585">Do not confuse: overlays are projections; screenshots/reports are evidence; renderer does not own gameplay truth.</text>
</svg>
