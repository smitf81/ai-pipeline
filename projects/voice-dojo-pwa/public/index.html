<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── PWA / Theme ──────────────────────────────────── -->
    <meta name="theme-color" content="#060d14" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── iOS Specific ─────────────────────────────────── -->
    <!-- Makes it feel native when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voice Dojo" />
    <!-- iOS home screen icons (Safari ignores manifest icons) -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ── Android / General ─────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Voice Dojo" />

    <!-- ── SEO / Share ──────────────────────────────────── -->
    <meta name="description" content="Character impression trainer. Unlock iconic voices, earn XP, track your progress." />
    <meta property="og:title" content="Voice Dojo" />
    <meta property="og:description" content="Train your character impressions. Unlock Troy McClure, Darth Vader, Arnie and more." />
    <meta property="og:type" content="website" />

    <!-- ── Fonts ────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- ── Prevent flash of white on dark app ───────────── -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        background: #060d14;
        min-height: 100%;
        /* Safe area insets for iPhone notch / Dynamic Island */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Prevent iOS text size adjustment */
      body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Prevent pull-to-refresh interfering with the app */
      body {
        overscroll-behavior-y: contain;
      }
    </style>

    <title>Voice Dojo</title>
  </head>
  <body>
    <noscript>Voice Dojo requires JavaScript to run.</noscript>
    <div id="root"></div>

    <!-- ── Register Service Worker ──────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
